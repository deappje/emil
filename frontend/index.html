<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantengids · tuinplanten op standplaats, kleur en ecologische waarde</title>
    <meta
      name="description"
      content="Zoek en orden tuinplanten op standplaats, hoogte, bloeikleur, bloeitijd, inheems of niet en waarde voor bijen, vlinders en vogels."
    />
    <meta name="theme-color" content="#3f6b4a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16241b" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233f6b4a'/%3E%3Cpath d='M9 23c0-8 5-13 14-14-1 9-6 14-14 14Zm0 0 7-7' fill='none' stroke='%23f6f3e8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved or system theme before the first paint.
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
