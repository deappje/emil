# The CloudNativePG operator and the app's database, in apply wave -2: the
# wave ends once the operator serves and the Cluster is Ready, by which time
# the operator has written the app-db-app Secret the app reads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.0.yaml
  - cluster.yaml
commonAnnotations:
  basable.com/apply-wave: "-2"
